<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Privacy principles under applicable law: a valid basis for each purpose, separate prior consent for optional profiling, minimisation, configuration-dependent security and data rights. Profile reset is partial; defaults and erasure gaps require operator action.">
  <style>
    .bg { fill: #f8fafc; }
    .roof { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .pillar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .pt { font: 600 13.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #0f172a; }
    .pb { font: 400 10.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #64748b; }
    .law { font: 600 10px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #2563eb; }
    .base { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .bt { font: 600 12.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #0f172a; }
    .roof-t { font: 600 14.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .roof { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .pillar { fill: #111827; stroke: #1e293b; }
      .pt { fill: #f1f5f9; }
      .pb { fill: #94a3b8; }
      .law { fill: #60a5fa; }
      .base { fill: #111827; stroke: #1e293b; }
      .bt { fill: #f1f5f9; }
      .roof-t { fill: #f1f5f9; }
    }
  </style>
  <rect class="bg" width="1000" height="400" rx="16"/>
  <rect class="roof" x="60" y="40" width="880" height="64" rx="12"/>
  <text class="roof-t" x="84" y="68">Privacy notice: data, purposes, retention and rights</text>
  <text class="law" x="84" y="90">Each purpose needs a valid legal basis</text>
  <rect class="pillar" x="60" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="78" y="168">Lawfulness</text>
  <text class="pb" x="78" y="190">Valid legal basis</text>
  <text class="pb" x="78" y="206">for each purpose;</text>
  <text class="pb" x="78" y="222">login is not consent</text>
  <text class="law" x="78" y="262">GDPR legal bases</text>
  <rect class="pillar" x="230" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="248" y="168">Purpose limit</text>
  <text class="pb" x="248" y="190">Optional profiling</text>
  <text class="pb" x="248" y="206">requires separate</text>
  <text class="pb" x="248" y="222">prior consent</text>
  <text class="law" x="248" y="262">GDPR purpose limits</text>
  <rect class="pillar" x="400" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="418" y="168">Minimisation</text>
  <text class="pb" x="418" y="190">Collect only what</text>
  <text class="pb" x="418" y="206">is needed; reset</text>
  <text class="pb" x="418" y="222">is only partial</text>
  <text class="law" x="418" y="262">GDPR minimisation</text>
  <rect class="pillar" x="570" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="588" y="168">Security</text>
  <text class="pb" x="588" y="190">Security measures</text>
  <text class="pb" x="588" y="206">depend on setup;</text>
  <text class="pb" x="588" y="222">verify deployment</text>
  <text class="law" x="588" y="262">GDPR security</text>
  <rect class="pillar" x="740" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="758" y="168">Your rights</text>
  <text class="pb" x="758" y="190">Access, correct,</text>
  <text class="pb" x="758" y="206">erase or object;</text>
  <text class="pb" x="758" y="222">contact for full request</text>
  <text class="law" x="758" y="262">Applicable rights</text>
  <rect class="base" x="60" y="312" width="880" height="56" rx="12"/>
  <text class="bt" x="84" y="336" font-size="12">Applicable law · GDPR where applicable</text>
  <text class="law" x="84" y="356">Defaults and erasure gaps need operator action</text>
</svg>
