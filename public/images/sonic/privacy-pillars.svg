<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" role="img" aria-label="Five privacy principles">
<style>
    .bg{fill:#f8fafc} .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
    .soft{fill:#f1f5f9;stroke:#e2e8f0;stroke-width:1.5}
    .accent{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.6}
    .warm{fill:#fffbeb;stroke:#fcd34d;stroke-width:1.5}
    .good{fill:#f0fdf4;stroke:#bbf7d0;stroke-width:1.5}
    .kicker{font:700 12px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;letter-spacing:.18em;fill:#2563eb}
    .num{font:700 13px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#2563eb}
    .label{font:600 18px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#0f172a}
    .label-sm{font:600 15px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#0f172a}
    .meta{font:400 12.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#64748b}
    .mono{font:400 12px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#64748b}
    .foot{font:600 12px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#64748b}
    .stroke{stroke:#e2e8f0;stroke-width:1.5;fill:none}
    .accent-stroke{stroke:#2563eb;stroke-width:1.8;fill:none}
    .arrow{stroke:#64748b;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrow-head{fill:#64748b}
    .icon{stroke:#475569;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .icon-accent{stroke:#2563eb;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .dot{fill:#2563eb}
    @media print{ .bg{fill:#fff} }
  </style>
<rect class="bg" width="1000" height="420" rx="18"/>
<text class="kicker" x="64" y="46">SONIC</text><line x1="64" y1="60" x2="936" y2="60" class="stroke"/><rect class="card" x="64" y="100" width="158.4" height="256" rx="14"/><g class="icon" transform="translate(176.4 116) scale(1.000)"><path d="M12 4v16 M6 8h12 M6 8l-3 6h6z M18 8l-3 6h6z M8 20h8"/></g><circle class="dot" cx="90" cy="125" r="3"/><text class="num" x="100" y="130">01</text><text class="label" x="88" y="314">Lawful basis</text><text class="meta" x="88" y="335">each purpose</text><rect class="card" x="242.4" y="100" width="158.4" height="256" rx="14"/><g class="icon" transform="translate(354.8 116) scale(1.000)"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 12h.01"/></g><circle class="dot" cx="268.4" cy="125" r="3"/><text class="num" x="278.4" y="130">02</text><text class="label" x="266.4" y="314">Purpose limit</text><text class="meta" x="266.4" y="335">no scope creep</text><rect class="card" x="420.8" y="100" width="158.4" height="256" rx="14"/><g class="icon" transform="translate(533.2 116) scale(1.000)"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></g><circle class="dot" cx="446.8" cy="125" r="3"/><text class="num" x="456.8" y="130">03</text><text class="label" x="444.8" y="314">Minimisation</text><text class="meta" x="444.8" y="335">collect less</text><rect class="card" x="599.2" y="100" width="158.4" height="256" rx="14"/><g class="icon" transform="translate(711.6 116) scale(1.000)"><path d="M6 11h12v9H6z M9 11V8a3 3 0 0 1 6 0v3 M12 15v2"/></g><circle class="dot" cx="625.2" cy="125" r="3"/><text class="num" x="635.2" y="130">04</text><text class="label" x="623.2" y="314">Security</text><text class="meta" x="623.2" y="335">verify setup</text><rect class="card" x="777.6" y="100" width="158.4" height="256" rx="14"/><g class="icon" transform="translate(890 116) scale(1.000)"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M4 21a8 8 0 0 1 16 0"/></g><circle class="dot" cx="803.6" cy="125" r="3"/><text class="num" x="813.6" y="130">05</text><text class="label" x="801.6" y="314">Your rights</text><text class="meta" x="801.6" y="335">access, erase</text>
</svg>
