<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" role="img" aria-label="Sonic two-plane architecture: browser, Cloudflare edge control plane, Linux data plane and upstream CDNs">
<style>
    .bg{fill:#0b0f19} .card{fill:#111827;stroke:#1e293b;stroke-width:1.5}
    .soft{fill:#0f172a;stroke:#1e293b;stroke-width:1.5}
    .accent{fill:rgba(59,130,246,0.12);stroke:#1d4ed8;stroke-width:1.6}
    .warm{fill:rgba(245,158,11,0.12);stroke:#92400e;stroke-width:1.5}
    .good{fill:rgba(34,197,94,0.12);stroke:#166534;stroke-width:1.5}
    .kicker{font:700 12px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;letter-spacing:.18em;fill:#60a5fa}
    .num{font:700 13px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#60a5fa}
    .label{font:600 18px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#f8fafc}
    .label-sm{font:600 15px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#f8fafc}
    .meta{font:400 12.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#94a3b8}
    .mono{font:400 12px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#94a3b8}
    .foot{font:600 12px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#94a3b8}
    .stroke{stroke:#1e293b;stroke-width:1.5;fill:none}
    .accent-stroke{stroke:#60a5fa;stroke-width:1.8;fill:none}
    .arrow{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrow-head{fill:#94a3b8}
    .icon{stroke:#cbd5e1;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .icon-accent{stroke:#60a5fa;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .dot{fill:#60a5fa}

  </style>
<rect class="bg" width="1000" height="460" rx="18"/>
<text class="kicker" x="64" y="46">SONIC</text><line x1="64" y1="60" x2="936" y2="60" class="stroke"/>
<rect class="card" x="64" y="90" width="220" height="300" rx="16"/>
<text class="num" x="88" y="122">01 · CLIENT</text>
<g class="icon-accent" transform="translate(88 140) scale(1.250)"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z M4 12h16 M12 4c2.5 2.3 4 5 4 8s-1.5 5.7-4 8c-2.5-2.3-4-5-4-8s1.5-5.7 4-8z"/></g>
<text class="label" x="88" y="210">Browser</text>
<text class="meta" x="88" y="234">sonic.epocanvas.tech</text>
<text class="meta" x="88" y="256">player and local storage</text>
<text class="meta" x="88" y="278">OAuth session</text>
<rect class="card" x="324" y="90" width="280" height="300" rx="16"/>
<text class="num" x="348" y="122">02 · CONTROL PLANE</text>
<g class="icon-accent" transform="translate(348 140) scale(1.250)"><path d="M7 18h10a4 4 0 0 0 .6-7.9A6 6 0 0 0 6.2 9.5 4.2 4.2 0 0 0 7 18z"/></g>
<text class="label" x="348" y="210">Cloudflare Edge</text>
<text class="meta" x="348" y="234">Pages Functions</text>
<text class="meta" x="348" y="256">routing · rate limit · cache</text>
<text class="meta" x="348" y="278">auth check · circuit breaker</text>
<text class="meta" x="348" y="300">audio proxy (Range 206)</text>
<rect class="card" x="644" y="90" width="292" height="300" rx="16"/>
<text class="num" x="668" y="122">03 · DATA PLANE</text>
<g class="icon-accent" transform="translate(668 140) scale(1.250)"><path d="M4 5h16v5H4z M4 14h16v5H4z M7 7.5h.01 M7 16.5h.01"/></g>
<text class="label" x="668" y="210">Linux Engine</text>
<text class="meta" x="668" y="234">Node.js · SQLite WAL</text>
<text class="meta" x="668" y="256">protocol parsing</text>
<text class="meta" x="668" y="278">recommendation core</text>
<text class="meta" x="668" y="300">loopback-only sidecar</text>
<path class="arrow" d="M284 220L316 220"/><path class="arrow-head" d="M310 216L316 220L309 223Z"/><path class="arrow" d="M604 220L636 220"/><path class="arrow-head" d="M630 216L636 220L629 223Z"/>
<rect class="soft" x="324" y="404" width="612" height="42" rx="10"/>
<text class="meta" x="348" y="430">encrypted tunnel · service key required</text>
<g class="icon" transform="translate(790 410) scale(0.917)"><path d="M9 18V6l10-2v11 M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0z M19 15a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></g>
<text class="meta" x="820" y="430">official CDNs</text>
</svg>
