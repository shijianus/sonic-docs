<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Sonic two-plane architecture: users connect to the Cloudflare edge control plane, the Linux data plane resolves sources and stores behavior events, audio streams are proxied from official CDNs">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .box-edge { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .box-vps { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .box-cdn { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .title { font: 600 13.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #0f172a; }
    .item { font: 400 10.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #64748b; }
    .tag { font: 600 10px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #2563eb; }
    .flow { stroke: #94a3b8; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .arrowhead { fill: #94a3b8; }
    .plane-label { font: 600 11px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .box { fill: #111827; stroke: #1e293b; }
      .box-edge { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .box-vps { fill: #111827; stroke: #1e293b; }
      .box-cdn { fill: #111827; stroke: #1e293b; }
      .title { fill: #f1f5f9; }
      .item { fill: #94a3b8; }
      .tag { fill: #60a5fa; }
      .flow { stroke: #475569; marker-end: url(#ar); }
      .arrowhead { fill: #475569; }
      .plane-label { fill: #f1f5f9; }
    }
  </style>
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="arrowhead"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="400" rx="16"/>

  <rect class="box" x="30" y="150" width="150" height="96" rx="10"/>
  <text class="title" x="48" y="180">Users</text>
  <text class="item" x="48" y="202">Browser / player</text>
  <text class="item" x="48" y="220">sonic.epocanvas.tech</text>

  <rect class="box-edge" x="240" y="60" width="250" height="280" rx="12"/>
  <text class="plane-label" x="260" y="88">Control Plane — Cloudflare Edge</text>
  <rect class="box-vps" x="258" y="104" width="214" height="52" rx="8"/>
  <text class="title" x="272" y="124">Pages Functions</text>
  <text class="item" x="272" y="142">Routing · rate limit · cache</text>
  <rect class="box-vps" x="258" y="166" width="214" height="52" rx="8"/>
  <text class="title" x="272" y="186">Edge Cache (sonic:*)</text>
  <text class="item" x="272" y="204">Fresh 8m · stale fallback</text>
  <rect class="box-vps" x="258" y="228" width="214" height="52" rx="8"/>
  <text class="title" x="272" y="248">Circuit Breaker</text>
  <text class="item" x="272" y="266">CLOSED / OPEN / HALF_OPEN</text>
  <text class="tag" x="260" y="322">Auth check · HMAC-signed API keys</text>

  <rect class="box-vps" x="550" y="60" width="250" height="280" rx="12"/>
  <text class="plane-label" x="570" y="88">Data Plane — Linux Engine</text>
  <rect class="box" x="568" y="104" width="214" height="52" rx="8"/>
  <text class="title" x="582" y="124">sonic-engine (Node.js)</text>
  <text class="item" x="582" y="142">Native protocol parsing</text>
  <rect class="box" x="568" y="166" width="214" height="52" rx="8"/>
  <text class="title" x="582" y="186">Recommendation Core</text>
  <text class="item" x="582" y="204">Behavior events · SQLite (WAL)</text>
  <rect class="box" x="568" y="228" width="214" height="52" rx="8"/>
  <text class="title" x="582" y="248">ncm-api Sidecar</text>
  <text class="item" x="582" y="266">Loopback-only internal network</text>
  <text class="tag" x="570" y="322">Encrypted tunnel · service key required</text>

  <rect class="box-cdn" x="850" y="150" width="120" height="96" rx="10"/>
  <text class="title" x="866" y="180">Official</text>
  <text class="title" x="866" y="198">CDNs</text>
  <text class="item" x="866" y="220">Audio · lyrics</text>

  <line class="flow" x1="180" y1="198" x2="236" y2="198"/>
  <line class="flow" x1="490" y1="198" x2="546" y2="198"/>
  <line class="flow" x1="800" y1="198" x2="846" y2="198"/>
  <path class="flow" d="M 365 60 C 365 30, 910 30, 910 146"/>
  <text class="tag" x="520" y="24">Audio streams: Range 206 edge proxy (default) or 302 redirect (opt-in)</text>
</svg>
