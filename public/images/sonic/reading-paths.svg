    .title { font: 600 22px system-ui, sans-serif; fill: #0f172a; }
    .sub { font: 400 16px system-ui, sans-serif; fill: #475569; }
    .number { font: 600 13px system-ui, sans-serif; fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #111827; stroke: #334155; }
