<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" width="960" height="224" role="img" aria-labelledby="title desc">
  <title id="title">Four reading paths through Sonic documentation</title>
  <desc id="desc">Start with the overview, explore the player, understand data and rights, or review deployment and development. Select a language below to read the corresponding documents.</desc>
