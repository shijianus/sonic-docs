<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Security controls for transport, authentication, outbound requests and storage depend on deployment. Not all links are encrypted; profile reset is partial, incognito can still send events, and revocation needs configuration and a successful request. Contact the operator for full data requests.">
  <style>
    .bg { fill: #f8fafc; }
    .layer { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .layer-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .lt { font: 600 13px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #0f172a; }
    .lb { font: 400 10.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #64748b; }
    .law { font: 600 10px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #2563eb; }
    .side { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .st { font: 600 12.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #0f172a; }
    .sb { font: 400 10.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .layer { fill: #111827; stroke: #1e293b; }
      .layer-accent { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .lt { fill: #f1f5f9; }
      .lb { fill: #94a3b8; }
      .law { fill: #60a5fa; }
      .side { fill: #111827; stroke: #1e293b; }
      .st { fill: #f1f5f9; }
      .sb { fill: #94a3b8; }
    }
  </style>
  <rect class="bg" width="1000" height="400" rx="16"/>

  <rect class="layer" x="60" y="46" width="640" height="64" rx="10"/>
  <text class="lt" x="84" y="72">L1 · Transport — protection varies by path</text>
  <text class="lb" x="84" y="92">HTTPS depends on deployment; not all upstream or internal links are encrypted.</text>

  <rect class="layer-accent" x="60" y="122" width="640" height="64" rx="10"/>
  <text class="lt" x="84" y="148">L2 · Authentication and signing</text>
  <text class="lb" x="84" y="168">OAuth + PKCE; signed sessions. Signing protects integrity, not confidentiality.</text>

  <rect class="layer" x="60" y="198" width="640" height="64" rx="10"/>
  <text class="lt" x="84" y="224">L3 · Outbound request checks</text>
  <text class="lb" x="84" y="244">Proxy target and redirect checks do not cover direct browser resources.</text>

  <rect class="layer" x="60" y="274" width="640" height="64" rx="10"/>
  <text class="lt" x="84" y="300">L4 · Storage and logs</text>
  <text class="lb" x="84" y="320">Isolation, access, retention and backups require operator setup and checks.</text>

  <rect class="side" x="730" y="46" width="240" height="292" rx="12"/>
  <text class="st" x="752" y="76">Control limits</text>
  <text class="sb" x="752" y="100">Profile reset is partial;</text>
  <text class="sb" x="752" y="118">contact for full data requests.</text>
  <text class="sb" x="752" y="144">Incognito can still</text>
  <text class="sb" x="752" y="162">send requests and events.</text>
  <text class="sb" x="752" y="188">Revocation needs setup</text>
  <text class="sb" x="752" y="206">and a successful request.</text>
  <text class="law" x="752" y="240">GDPR where applicable</text>
  <text class="law" x="752" y="256">Privacy by design</text>
  <text class="law" x="752" y="280">Security depends on setup</text>
  <text class="law" x="752" y="296">Defaults need operator action</text>
  <text class="law" x="752" y="320">Erasure gaps need follow-up</text>
</svg>
