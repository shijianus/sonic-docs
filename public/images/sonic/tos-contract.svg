<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Service terms: notice and valid acceptance, free test use, notified changes and exit. OAuth alone is not acceptance or profiling consent; profile reset is partial and revocation depends on setup and request success. Mandatory rights remain.">
  <style>
    .bg { fill: #f8fafc; }
    .stage { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .stage-one { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .base { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .st { font: 600 13px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #0f172a; }
    .sb { font: 400 10.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #64748b; }
    .law { font: 600 10px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #2563eb; }
    .flow { stroke: #94a3b8; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .arrowhead { fill: #94a3b8; }
    .bt { font: 600 12.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .stage { fill: #111827; stroke: #1e293b; }
      .stage-one { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .base { fill: #111827; stroke: #1e293b; }
      .st { fill: #f1f5f9; }
      .sb { fill: #94a3b8; }
      .law { fill: #60a5fa; }
      .flow { stroke: #475569; }
      .arrowhead { fill: #475569; }
      .bt { fill: #f1f5f9; }
    }
  </style>
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="arrowhead"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="400" rx="16"/>

  <rect class="stage-one" x="40" y="110" width="212" height="150" rx="10"/>
  <text class="st" x="58" y="140">1. Acceptance</text>
  <text class="sb" x="58" y="164">Terms need valid acceptance;</text>
  <text class="sb" x="58" y="180">OAuth alone is not</text>
  <text class="sb" x="58" y="196">acceptance or optional</text>
  <text class="sb" x="58" y="212">profiling consent.</text>
  <text class="law" x="58" y="244">Notice before acceptance</text>

  <rect class="stage" x="290" y="110" width="212" height="150" rx="10"/>
  <text class="st" x="308" y="140">2. Use</text>
  <text class="sb" x="308" y="164">Search, playback, lyrics;</text>
  <text class="sb" x="308" y="180">free test service.</text>
  <text class="sb" x="308" y="196">No extra uptime SLA;</text>
  <text class="sb" x="308" y="212">MIT covers code, not music.</text>
  <text class="law" x="308" y="244">Mandatory rights remain</text>

  <rect class="stage" x="540" y="110" width="212" height="150" rx="10"/>
  <text class="st" x="558" y="140">3. Amendments</text>
  <text class="sb" x="558" y="164">Explain changes and</text>
  <text class="sb" x="558" y="180">their effective date;</text>
  <text class="sb" x="558" y="196">renew acceptance</text>
  <text class="sb" x="558" y="212">where required.</text>
  <text class="law" x="558" y="244">Prior notice required</text>

  <rect class="stage" x="790" y="110" width="170" height="150" rx="10"/>
  <text class="st" x="808" y="140">4. Termination</text>
  <text class="sb" x="808" y="164">Leave at any time;</text>
  <text class="sb" x="808" y="180">reset is partial.</text>
  <text class="sb" x="808" y="196">Contact for full request;</text>
  <text class="sb" x="808" y="212">revocation needs setup.</text>
  <text class="law" x="808" y="244">Exit preserves rights</text>

  <line class="flow" x1="252" y1="185" x2="286" y2="185"/>
  <line class="flow" x1="502" y1="185" x2="536" y2="185"/>
  <line class="flow" x1="752" y1="185" x2="786" y2="185"/>

  <rect class="base" x="40" y="300" width="920" height="60" rx="12"/>
  <text class="bt" x="64" y="326">Applicable law and competent courts</text>
  <text class="law" x="64" y="346">Mandatory rights remain · governing law depends on the facts</text>
</svg>
