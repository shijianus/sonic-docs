<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" role="img" aria-label="Troubleshooting in four steps">
<style>
    .bg{fill:#f8fafc} .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
    .soft{fill:#f1f5f9;stroke:#e2e8f0;stroke-width:1.5}
    .accent{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.6}
    .warm{fill:#fffbeb;stroke:#fcd34d;stroke-width:1.5}
    .good{fill:#f0fdf4;stroke:#bbf7d0;stroke-width:1.5}
    .kicker{font:700 12px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;letter-spacing:.18em;fill:#2563eb}
    .num{font:700 13px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#2563eb}
    .label{font:600 18px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#0f172a}
    .label-sm{font:600 15px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#0f172a}
    .meta{font:400 12.5px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#64748b}
    .mono{font:400 12px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#64748b}
    .foot{font:600 12px -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans CJK SC', sans-serif;fill:#64748b}
    .stroke{stroke:#e2e8f0;stroke-width:1.5;fill:none}
    .accent-stroke{stroke:#2563eb;stroke-width:1.8;fill:none}
    .arrow{stroke:#64748b;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .arrow-head{fill:#64748b}
    .icon{stroke:#475569;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .icon-accent{stroke:#2563eb;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .dot{fill:#2563eb}
    @media print{ .bg{fill:#fff} }
  </style>
<rect class="bg" width="1000" height="420" rx="18"/>
<text class="kicker" x="64" y="46">SONIC</text><line x1="64" y1="60" x2="936" y2="60" class="stroke"/><rect class="card" x="64" y="128" width="198.5" height="158" rx="14"/><g class="icon" transform="translate(216.5 144) scale(1.000)"><path d="M12 4l9 16H3z M12 9v5 M12 17h.01"/></g><circle class="dot" cx="90" cy="153" r="3"/><text class="num" x="100" y="158">01</text><text class="label" x="88" y="244">Symptom</text><text class="meta" x="88" y="265">degraded or failed</text><rect class="card" x="288.5" y="128" width="198.5" height="158" rx="14"/><g class="icon" transform="translate(441 144) scale(1.000)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></g><circle class="dot" cx="314.5" cy="153" r="3"/><text class="num" x="324.5" y="158">02</text><text class="label" x="312.5" y="244">Check status</text><text class="meta" x="312.5" y="265">banner and retry</text><rect class="card" x="513" y="128" width="198.5" height="158" rx="14"/><g class="icon" transform="translate(665.5 144) scale(1.000)"><path d="M5 5h6a4 4 0 0 1 0 8H7a4 4 0 0 0 0 8h12 M17 18l3 3-3 3"/></g><circle class="dot" cx="539" cy="153" r="3"/><text class="num" x="549" y="158">03</text><text class="label" x="537" y="244">Fallback</text><text class="meta" x="537" y="265">may also fail</text><rect class="card" x="737.5" y="128" width="198.5" height="158" rx="14"/><g class="icon" transform="translate(890 144) scale(1.000)"><path d="M3 6h18v12H3z M3 7l9 6 9-6"/></g><circle class="dot" cx="763.5" cy="153" r="3"/><text class="num" x="773.5" y="158">04</text><text class="label" x="761.5" y="244">Report</text><text class="meta" x="761.5" y="265">scrub sensitive data</text><path class="arrow" d="M266.5 207L282.5 207"/><path class="arrow-head" d="M276.5 203L282.5 207L275.5 210Z"/><path class="arrow" d="M491 207L507 207"/><path class="arrow-head" d="M501 203L507 207L500 210Z"/><path class="arrow" d="M715.5 207L731.5 207"/><path class="arrow-head" d="M725.5 203L731.5 207L724.5 210Z"/>
